name: Implement subtask

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      integration_branch:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: number
      integration_branch:
        required: true
        type: string

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      branch: ${{ steps.branch.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.integration_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch subtask issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .runtime
          gh issue view ${{ inputs.issue_number }} --json title -q .title > .runtime/title.txt
          gh issue view ${{ inputs.issue_number }} --json body -q .body > .runtime/body.txt

      - name: Configure git identity
        run: |
          git config --global user.name "Claude"
          git config --global user.email "claude@anthropic.com"

      - name: Create branch off integration
        id: branch
        run: |
          BRANCH="feat/subtask-${{ inputs.issue_number }}"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_ENV"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Build prompt
        run: |
          mkdir -p .runtime
          python3 -c "
          title = open('.runtime/title.txt').read().strip()
          body = open('.runtime/body.txt').read().strip()
          tpl = open('.github/prompts/implement.md').read()
          tpl = tpl.replace('{{ISSUE_TITLE}}', title).replace('{{ISSUE_BODY}}', body)
          open('.runtime/prompt.md', 'w').write(tpl)
          "

      - name: Run implementation
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat .runtime/prompt.md)" \
            --model ${{ vars.WORKER_MODEL }} \
            --effort ${{ vars.WORKER_EFFORT }} \
            --max-turns ${{ vars.WORKER_TURNS }} \
            --dangerously-skip-permissions

      - name: Debug workspace state
        run: |
          echo "--- pwd ---"
          pwd
          echo "--- full tree ---"
          find . -maxdepth 3 -not -path './node_modules*' -not -path './.git*'
          echo "--- git status ---"
          git status

      - name: Commit and push
        run: |
          # Claude may have already committed during its run — only commit if there's uncommitted work
          if ! git diff --cached --quiet || ! git diff --quiet; then
            git add -A
            git commit -m "Implement #${{ inputs.issue_number }}"
          fi
          git push -u origin "${{ env.branch }}"

  test:
    needs: implement
    uses: ./.github/workflows/run-tests.yml
    with:
      ref: ${{ needs.implement.outputs.branch }}

  open-pr:
    needs: [implement, test]
    # Check native job result rather than custom output
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4
      - env:
          # Change this to a PAT if you want 'on: pull_request' CI to run against the new PR
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE=$(gh issue view ${{ inputs.issue_number }} --json title -q .title)
          gh pr create \
            --base ${{ inputs.integration_branch }} \
            --head ${{ needs.implement.outputs.branch }} \
            --title "$TITLE" \
            --body "Closes #${{ inputs.issue_number }}" \
            --label "subtask-pr"

  comment-on-failure:
    needs: [implement, test]
    # always() ensures this runs even if previous jobs abort.
    # Check for native failure rather than an output parameter
    if: always() && (needs.implement.result == 'failure' || needs.test.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ inputs.issue_number }} \
            --body "⚠️ Subtask failed on run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
